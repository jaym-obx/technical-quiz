/* ============================== REMEDIATION LIST PARSING ============================== */
// Expected columns, in order:
//   ISSUE | DESCRIPTION / REC | URL COUNT | AREA | DIFFICULTY | POTENTIAL IMPACT | SLIDE / TAB / LINKS
// Accepts tab-separated (Google Sheets copy/paste), pipe-delimited, or comma-separated input.
// A header row is optional: if none is found, columns are read positionally in the order above.
var REMEDIATION_COLUMNS = [
  {key:"issue",       aliases:["issue"]},
  {key:"description", aliases:["description / rec","description/rec","description","rec"]},
  {key:"urlCount",    aliases:["url count","urls","count"]},
  {key:"area",        aliases:["area"]},
  {key:"difficulty",  aliases:["difficulty"]},
  {key:"impact",      aliases:["potential impact","impact"]},
  {key:"links",       aliases:["slide / tab / links","slide/tab/links","links","slide","tab"]}
];

function splitRow(line){
  line = line.replace(/\s+$/, "");
  if(line.indexOf("\t") !== -1) return line.split("\t").map(cleanCell);
  if(line.indexOf("|") !== -1){
    var cells = line.split("|");
    // drop leading/trailing empty cells produced by outer pipes
    if(cells.length && cells[0].trim() === "") cells.shift();
    if(cells.length && cells[cells.length-1].trim() === "") cells.pop();
    return cells.map(cleanCell);
  }
  return line.split(",").map(cleanCell);
}

function cleanCell(c){
  return String(c)
    // Google Drive's markdown export marks merged cells and escapes punctuation.
    .replace(/\\+\[merged\\*\]/gi, "")
    .replace(/\[merged\]/gi, "")
    .replace(/\\+([-<>#*_[\]()|.+])/g, "$1")
    .replace(/^"(.*)"$/, "$1")
    .trim();
}

function isSeparatorRow(cells){
  return cells.every(function(c){ return /^:?-{1,}:?$/.test(c) || c === ""; });
}

// Header cells are short labels. Data rows carry long prose, so a length ceiling is the
// cheapest reliable way to tell them apart.
var MAX_HEADER_CELL_LENGTH = 40;

// Exact matches only. Contains-matching against data rows was the original failure: a
// description mentioning "URLs" or "links" scored enough alias hits to be mistaken for a
// header row, which silently remapped every column for all rows that followed.
function exactColumnMap(cellsLower){
  var map = {};
  var taken = {};
  REMEDIATION_COLUMNS.forEach(function(col){ map[col.key] = -1; });
  REMEDIATION_COLUMNS.forEach(function(col){
    for(var i=0;i<cellsLower.length;i++){
      if(taken[i]) continue;
      if(col.aliases.indexOf(cellsLower[i]) !== -1){ map[col.key] = i; taken[i] = true; return; }
    }
  });
  return map;
}

// Once a row is confirmed to be a header, fill any still-unmapped columns loosely. Safe here
// because we already know we're looking at header labels, not prose.
function fillColumnMapLoosely(map, cellsLower){
  var taken = {};
  REMEDIATION_COLUMNS.forEach(function(col){ if(map[col.key] >= 0) taken[map[col.key]] = true; });
  REMEDIATION_COLUMNS.forEach(function(col){
    if(map[col.key] !== -1) return;
    for(var i=0;i<cellsLower.length;i++){
      if(taken[i]) continue;
      for(var j=0;j<col.aliases.length;j++){
        if(cellsLower[i].indexOf(col.aliases[j]) !== -1){ map[col.key] = i; taken[i] = true; return; }
      }
    }
  });
  return map;
}

function buildColumnMap(cellsLower){
  return fillColumnMapLoosely(exactColumnMap(cellsLower), cellsLower);
}

function countMappedColumns(map){
  var n = 0;
  REMEDIATION_COLUMNS.forEach(function(col){ if(map[col.key] >= 0) n++; });
  return n;
}

// A row qualifies as a header only if every cell is short and it names at least three known
// columns exactly. Both conditions together keep prose rows from hijacking the mapping.
function headerMapFor(cells){
  var tooLong = cells.some(function(c){ return c.length > MAX_HEADER_CELL_LENGTH; });
  if(tooLong) return null;
  var cellsLower = cells.map(function(c){ return c.toLowerCase(); });
  var exact = exactColumnMap(cellsLower);
  if(countMappedColumns(exact) < 3) return null;
  return fillColumnMapLoosely(exact, cellsLower);
}

// Section banners arrive as the label repeated across every merged cell, e.g.
// "| | SEO QUICK WINS | SEO QUICK WINS | SEO QUICK WINS | ... |".
function sectionLabelFor(cells){
  var nonEmpty = cells.filter(function(c){ return c !== ""; });
  if(nonEmpty.length === 0) return null;
  var first = nonEmpty[0];
  if(first.length >= 40) return null;
  if(!/^[a-z0-9 &/+.,'\-]+$/i.test(first)) return null;
  if(first !== first.toUpperCase()) return null;
  var allSame = nonEmpty.every(function(c){ return c === first; });
  if(!allSame) return null;
  // A single short all-caps cell, or the same label repeated across merged cells.
  return first;
}

// Columns read straight off position when the paste has no header row.
function positionalColumnMap(){
  var map = {};
  REMEDIATION_COLUMNS.forEach(function(col, i){ map[col.key] = i; });
  return map;
}

// Proper RFC 4180 CSV parsing: handles quoted fields, embedded commas and newlines, and
// doubled quotes. Critically, empty fields stay as explicit empty cells rather than collapsing,
// which is what keeps every column after a blank cell from shifting left.
function parseCsv(text){
  var rows = [];
  var row = [];
  var field = "";
  var inQuotes = false;
  text = String(text).replace(/^\uFEFF/, ""); // strip BOM

  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
      continue;
    }
    if(ch === '"'){ inQuotes = true; continue; }
    if(ch === ','){ row.push(field); field = ""; continue; }
    if(ch === '\r'){ continue; }
    if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; continue; }
    field += ch;
  }
  row.push(field);
  rows.push(row);
  return rows.map(function(r){ return r.map(cleanCell); });
}

// Shared step: turn a matrix of cells into remediation items. Used by both the paste box and
// the CSV upload so they behave identically.
function rowsToRemediationItems(rows, allowPositional){
  var items = [];
  var colMap = null;
  var currentSection = "General";
  var skippedNoIssue = 0;

  for(var i=0;i<rows.length;i++){
    var cells = rows[i];
    if(!cells || cells.length === 0) continue;
    if(isSeparatorRow(cells)) continue;

    var nonEmpty = cells.filter(function(c){ return c !== ""; });
    if(nonEmpty.length === 0) continue;

    // Section banner (single all-caps cell, or the label repeated across merged cells).
    var section = sectionLabelFor(cells);
    if(section){ currentSection = section; continue; }

    // Header rows may repeat under each section, so keep checking for them.
    var headerMap = headerMapFor(cells);
    if(headerMap){ colMap = headerMap; continue; }

    if(!colMap){
      if(!allowPositional) continue;
      colMap = positionalColumnMap();
    }

    if(!colMap){
      if(!allowPositional) continue;
      colMap = positionalColumnMap();
    }

    var get = function(key){
      var idx = colMap[key];
      return (idx != null && idx >= 0 && idx < cells.length) ? cells[idx] : "";
    };
    var issue = get("issue");
    if(!issue){ skippedNoIssue++; continue; }

    items.push({
      id: uid("rem"),
      section: currentSection,
      issue: issue,
      description: get("description"),
      urlCount: get("urlCount"),
      area: get("area"),
      difficulty: get("difficulty"),
      impact: get("impact"),
      links: get("links")
    });
  }
  return {items: items, skipped: skippedNoIssue, foundHeader: !!colMap};
}

function parseRemediationText(raw){
  if(!raw || !raw.trim()) return [];
  var lines = raw.split("\n").map(function(l){ return l.replace(/\r/g,""); }).filter(function(l){ return l.trim() !== ""; });
  var rows = lines.map(splitRow);
  return rowsToRemediationItems(rows, true).items;
}

function parseRemediationCsv(text){
  // CSV exports carry their header row, so positional guessing isn't needed; but fall back to
  // it anyway if no recognizable header turns up.
  var rows = parseCsv(text);
  var result = rowsToRemediationItems(rows, false);
  if(result.items.length === 0) result = rowsToRemediationItems(rows, true);
  return result;
}

  {test: /header|navigation|sub.navigation/i, menuId: "header-opt"},
  {test: /footer/i, menuId: "footer-opt"},
  {test: /accessib/i, menuId: "accessibility-audit"},
  {test: /google business profile|\bgbp\b|google my business|\bgmb\b/i, menuId: "gbp-opt"},
  {test: /merchant center|shopping feed/i, menuId: "gmc-audit"},
  {test: /keyword (mapping|cannibal)/i, menuId: "keyword-mapping"},
  {test: /video/i, menuId: "video-opt"}
];

// Thin/missing content always routes to an actual content-development task (not the Content Gap
// Analysis audit deliverable) - matched before the general pairing rules below.
var CONTENT_TRIGGER = /thin content|missing content|lack of (supporting )?content|content is missing|sparse content|underdeveloped content|no (on.page )?content/i;

function suggestContentMenuId(item){
  var text = (item.issue + " " + item.description).toLowerCase();
  if(/homepage/.test(text)) return "homepage-content";
  if(/category/.test(text)) return "category-content";
  if(/product/.test(text)) return "product-desc-50";
  if(/landing/.test(text)) return "landing-content";
  if(/blog|article/.test(text)) return "blog-content";
  return "category-content"; // general-purpose, volume-scalable default
}

/* ============================== PAGE COUNT SCALING ============================== */
// How many pages one unit of a deliverable covers. Tasks listed here scale their volume
// multiplier off the site's Page Count instead of off the number of linked remediation items.
var PAGES_PER_UNIT = {
  "base-opt-25": 25,
  "base-opt-25-kw": 25,
  "base-opt-50": 50,
  "base-opt-75": 75,
  "base-opt-100": 100,
  "full-page-opt": 1,
  "full-page-opt-5": 5,
  "keyword-mapping": 50,
  "internal-linking": 250,
  "image-alt": 250,
  "product-desc-25": 25,
  "product-desc-50": 50,
  "product-desc-75": 75,
  "product-desc-100": 100,
  "category-top-10": 10,
  "category-top-20": 20,
  "category-top-50": 50,
  "category-content": 1,
  "category-content-5": 5
};

// Keeps a single line item from swallowing the whole retainer on very large sites.
var MAX_PAGE_SCALED_MULTIPLIER = 8;

function pageCount(){
  var n = Number(state.setup.pageCount);
  return (isFinite(n) && n > 0) ? n : 0;
}

function isPageScaled(menuId){
  return Object.prototype.hasOwnProperty.call(PAGES_PER_UNIT, menuId);
}

function pageScaledMultiplier(menuId){
  var per = PAGES_PER_UNIT[menuId];
  var pages = pageCount();
  if(!per || !pages) return 1;
  return Math.max(1, Math.min(MAX_PAGE_SCALED_MULTIPLIER, Math.ceil(pages / per)));
}

// Picks the Base Optimizations tier that covers the site in the fewest units.
function bestBaseOptMenuId(){
  var pages = pageCount();
  if(pages <= 25) return "base-opt-25";
  if(pages <= 50) return "base-opt-50";
  if(pages <= 75) return "base-opt-75";
  return "base-opt-100";
}

/* ============================== REMEDIATION ROUTING RULES ============================== */
// Each remediation finding is classified once. A rule can produce a standalone line item, an
// increment to one of the Implementation buckets, or both. Rules are evaluated top to bottom
// and the first match wins, so specific findings are handled before the generic area catch-all.
var ROUTING_RULES = [
  {
    id: "schema",
    test: function(it){ return /schema/i.test(it.issue + " " + it.description); },
    menuId: "schema-review",
    implTechnical: 2
  },
  {
    id: "page-speed",
    test: function(it){
      return /page ?speed|site speed/i.test(it.area) ||
        /core web vital|\blcp\b|\bcls\b|\binp\b|ttfb|render.blocking|offscreen image|cache policy|properly size image|image dimension|server response/i.test(it.issue + " " + it.description);
    },
    menuId: "site-speed",
    forcedMonthIndex: 1, // Month 2
    implTechnical: 3
  },
  {
    id: "heading-structure",
    test: function(it){ return /heading structure/i.test(it.issue); },
    strategistTask: true,
    implContent: 1
  },
  {
    id: "xml-sitemap",
    test: function(it){ return /xml sitemap|sitemap\.xml/i.test(it.issue); },
    noLineItem: true, // rolled into implementation time rather than its own deliverable
    implTechnical: 1
  },
  {
    id: "homepage",
    test: function(it){ return /home ?page/i.test(it.issue + " " + it.description); },
    menuId: "homepage-opt",
    forcedMonthIndex: 0 // Month 1
  }
];

// Difficulty determines the size of the catch-all strategist task used for findings with no
// dedicated deliverable.
var STRATEGIST_TASK_BY_DIFFICULTY = {
  "easy": "catchall-strategist-s",
  "moderate": "catchall-strategist-m",
  "difficult": "catchall-strategist-l"
};

function strategistMenuIdFor(item){
  return STRATEGIST_TASK_BY_DIFFICULTY[(item.difficulty || "").toLowerCase()] || "catchall-strategist-m";
}

var AREA_TECHNICAL = /technical|linking|equity|speed|crawl|index/i;
var AREA_CONTENT = /on.?page|content|copy/i;

// Walks the remediation list once and returns everything the roadmap builder needs: grouped
// deliverables, standalone per-issue strategist tasks, and the accumulated Implementation
// bucket multipliers.
function buildRemediationPlan(sortedItems){
  var plan = {
    grouped: {},        // menuId -> {menuId, remediationIds, items, isContentTask, forcedMonthIndex}
    standalone: [],     // {item, menuId} - one line item per issue, named after the issue
    implTechnical: 0,
    implContent: 0
  };

  function addGrouped(menuId, item, isContentTask, forcedMonthIndex){
    if(!plan.grouped[menuId]){
      plan.grouped[menuId] = {menuId: menuId, remediationIds: [], items: [], isContentTask: !!isContentTask, forcedMonthIndex: null};
    }
    var g = plan.grouped[menuId];
    g.remediationIds.push(item.id);
    g.items.push(item);
    if(forcedMonthIndex != null) g.forcedMonthIndex = forcedMonthIndex;
  }

  sortedItems.forEach(function(item){
    var text = [item.issue, item.description, item.area].join(" ");

    // Thin/missing content still routes to real content development.
    if(CONTENT_TRIGGER.test(text)){
      addGrouped(suggestContentMenuId(item), item, true, null);
      plan.implContent += 1;
      return;
    }

    var matched = null;
    for(var i=0;i<ROUTING_RULES.length;i++){
      if(ROUTING_RULES[i].test(item)){ matched = ROUTING_RULES[i]; break; }
    }

    if(matched){
      plan.implTechnical += (matched.implTechnical || 0);
      plan.implContent += (matched.implContent || 0);
      if(matched.strategistTask){
        plan.standalone.push({item: item, menuId: strategistMenuIdFor(item)});
      } else if(!matched.noLineItem && matched.menuId){
        addGrouped(matched.menuId, item, false, matched.forcedMonthIndex);
      }
      return;
    }

    // No specific rule matched. Try the general deliverable pairings, then fall back to a
    // per-issue strategist task sized by difficulty.
    var paired = null;
    for(var j=0;j<PAIRING_RULES.length;j++){
      if(PAIRING_RULES[j].test.test(text)){ paired = PAIRING_RULES[j].menuId; break; }
    }
    if(paired) addGrouped(paired, item, false, null);
    else plan.standalone.push({item: item, menuId: strategistMenuIdFor(item)});

    // Every remaining finding still carries implementation time, routed by its Area.
    if(AREA_TECHNICAL.test(item.area)) plan.implTechnical += 1;
    else if(AREA_CONTENT.test(item.area)) plan.implContent += 1;
    else plan.implTechnical += 1; // unclassified defaults to technical
  });

  return plan;
}

// Cached so buildBucketRows and flexBudgetTargets see the same numbers the core rows were
// built from, without walking the remediation list repeatedly.
var lastRemediationPlan = null;

function currentImplementationTotals(){
  if(lastRemediationPlan) return {technical: lastRemediationPlan.implTechnical, content: lastRemediationPlan.implContent};
  var plan = buildRemediationPlan(state.remediation.slice());
  return {technical: plan.implTechnical, content: plan.implContent};
}

// Assessment and site-wide deliverables are bought once no matter how many findings point at
// them. You commission one Site Speed Assessment, not one per failing metric; the volume of
// findings shows up in the Implementation buckets instead.
var SINGLE_INSTANCE_TASKS = {
  "site-speed": true, "light-site-speed": true, "site-speed-data": true,
  "schema-review": true, "accessibility-audit": true, "backlink-assessment": true,
  "content-gap": true, "competitive-analysis": true, "gmc-audit": true, "gbp-opt": true,
  "html-sitemap": true, "xml-sitemap": true, "header-opt": true, "footer-opt": true,
  "homepage-opt": true, "internal-linking": true, "video-opt": true
};

function groupMultiplier(menuId, linkedCount){
  if(SINGLE_INSTANCE_TASKS[menuId]) return 1;
  if(isPageScaled(menuId)) return pageScaledMultiplier(menuId);
  return linkedCount;
}

function impactWeight(impact){
  var m = {"High":3, "Medium":2, "Low":1};
  return m[impact] || 1;
}
function difficultyWeight(diff){
  var m = {"Easy":1, "Moderate":2, "Difficult":3};
  return m[diff] || 2;
}

// Builds roadmap.core from the remediation plan, sorted by impact desc then difficulty asc
// (quick, high-impact wins first).
//
// Grouped deliverables: one line item per menu task, multiplier = linked issue count (or page
// count for page-scaled deliverables). Standalone items get their own line named after the
// issue. Content tasks always start in Month 2 and, for Ongoing MRR, run to the end.
function buildRulesBasedRoadmap(){
  var sorted = state.remediation.slice().sort(function(a,b){
    var scoreA = impactWeight(a.impact) * 10 - difficultyWeight(a.difficulty);
    var scoreB = impactWeight(b.impact) * 10 - difficultyWeight(b.difficulty);
    return scoreB - scoreA;
  });

  var plan = buildRemediationPlan(sorted);
  lastRemediationPlan = plan;

  var grouped = plan.grouped;
  var duration = state.setup.duration;
  var order = Object.keys(grouped);
  var regularOrder = order.filter(function(k){ return !grouped[k].isContentTask; });
  var contentOrder = order.filter(function(k){ return grouped[k].isContentTask; });
  var rows = [];

  regularOrder.forEach(function(menuId, idx){
    var menuTask = findMenuTask(menuId);
    if(!menuTask) return;
    var group = grouped[menuId];
    var months = newMonthsArray(duration, "none");
    var placementMonth = (group.forcedMonthIndex != null)
      ? Math.min(group.forcedMonthIndex, duration - 1)
      : Math.min(idx, duration - 1);
    months[placementMonth] = true;
    rows.push({
      id: uid("task"),
      name: menuTask.name,
      description: menuTask.description,
      hoursBase: menuTaskHours(menuTask) || 1,
      multiplier: groupMultiplier(menuId, group.remediationIds.length),
      months: months,
      sourceMenuId: menuId,
      linkedRemediationIds: group.remediationIds,
      isContentTask: false
    });
  });

  // One line per unmatched issue, prefixed with the issue it addresses, e.g.
  // "On Page Heading Structure - Standard SEO Strategist Task - S".
  plan.standalone.forEach(function(entry, idx){
    var menuTask = findMenuTask(entry.menuId);
    if(!menuTask) return;
    var months = newMonthsArray(duration, "none");
    months[Math.min(regularOrder.length + idx, duration - 1)] = true;
    rows.push({
      id: uid("task"),
      name: entry.item.issue + " - " + menuTask.name,
      description: entry.item.description || menuTask.description,
      hoursBase: menuTaskHours(menuTask) || 1,
      multiplier: 1,
      months: months,
      sourceMenuId: entry.menuId,
      linkedRemediationIds: [entry.item.id],
      isContentTask: false
    });
  });

  if(contentOrder.length){
    var isMrr = state.setup.roadmapType === "mrr";
    var activeMonthCount = duration >= 2 ? (isMrr ? (duration - 1) : 1) : 1;
    var totalContentBudget = 0.5 * pointsPerColumn() * activeMonthCount;
    var perTaskBudget = totalContentBudget / contentOrder.length;

    contentOrder.forEach(function(menuId){
      var menuTask = findMenuTask(menuId);
      if(!menuTask) return;
      var group = grouped[menuId];
      var months = newMonthsArray(duration, "none");
      if(duration >= 2){
        if(isMrr){
          for(var mm = 1; mm < duration; mm++) months[mm] = true;
        } else {
          months[1] = true;
        }
      } else {
        months[0] = true;
      }
      var hoursBase = menuTaskHours(menuTask) || 1;
      var multiplier = Math.max(1, Math.floor(perTaskBudget / hoursBase));
      rows.push({
        id: uid("task"),
        name: menuTask.name,
        description: menuTask.description,
        hoursBase: hoursBase,
        multiplier: multiplier,
        months: months,
        sourceMenuId: menuId,
        linkedRemediationIds: group.remediationIds,
        isContentTask: true
      });
    });
  }

  // Foundation tasks: every Ongoing MRR roadmap opens with a keyword map and a base
  // optimization pass in Month 1, whether or not the audit called them out. If the pairing
  // engine already placed one, pull it forward to Month 1 rather than duplicating it.
  if(state.setup.roadmapType === "mrr"){
    var foundationIds = ["keyword-mapping", bestBaseOptMenuId()];
    foundationIds.forEach(function(menuId){
      var existing = null;
      for(var i=0;i<rows.length;i++){
        // Any base-opt tier counts as the base optimization slot being filled.
        var matches = (menuId === "keyword-mapping")
          ? rows[i].sourceMenuId === "keyword-mapping"
          : rows[i].sourceMenuId.indexOf("base-opt") === 0;
        if(matches){ existing = rows[i]; break; }
      }
      if(existing){
        existing.months = newMonthsArray(duration, "none");
        existing.months[0] = true;
        // The pairing engine picks a base-opt tier from the issue text alone; re-tier it against
        // the actual page count so a large site doesn't get covered in tiny increments.
        if(menuId !== "keyword-mapping" && existing.sourceMenuId !== menuId){
          var betterTask = findMenuTask(menuId);
          if(betterTask){
            existing.name = betterTask.name;
            existing.description = betterTask.description;
            existing.hoursBase = menuTaskHours(betterTask) || 1;
            existing.sourceMenuId = menuId;
          }
        }
        existing.multiplier = pageScaledMultiplier(existing.sourceMenuId);
        existing.isFoundation = true;
        return;
      }
      var menuTask = findMenuTask(menuId);
      if(!menuTask) return;
      var months = newMonthsArray(duration, "none");
      months[0] = true;
      rows.unshift({
        id: uid("task"), name: menuTask.name, description: menuTask.description,
        hoursBase: menuTaskHours(menuTask) || 1,
        multiplier: pageScaledMultiplier(menuId),
        months: months, sourceMenuId: menuId, linkedRemediationIds: [],
        isContentTask: false, isSupplementary: true, isFoundation: true
      });
    });
  }

  // Supplementary tasks: link building work is a strong default addition even when no
  // remediation item points at it directly. Add a one-time Backlink Assessment early on and an
  // ongoing Link-Building push starting after Month 2, unless the remediation list already
  // surfaced one (e.g. an explicit "referring domains" finding).
  var hasBacklinkAssessment = rows.some(function(r){ return r.sourceMenuId === "backlink-assessment"; });
  var hasLinkBuilding = rows.some(function(r){ return r.sourceMenuId === "link-building"; });

  if(!hasBacklinkAssessment){
    var baTask = findMenuTask("backlink-assessment");
    if(baTask){
      var baMonths = newMonthsArray(duration, "none");
      baMonths[Math.min(2, duration - 1)] = true; // Month 3 if available
      rows.push({
        id: uid("task"), name: baTask.name, description: baTask.description,
        hoursBase: menuTaskHours(baTask) || 1, multiplier: 1, months: baMonths,
        sourceMenuId: "backlink-assessment", linkedRemediationIds: [], isContentTask: false, isSupplementary: true
      });
    }
  }

  if(!hasLinkBuilding && duration > 2){
    var lbTask = findMenuTask("link-building");
    if(lbTask){
      var lbMonths = newMonthsArray(duration, "none");
      for(var lm = 2; lm < duration; lm++) lbMonths[lm] = true; // after Month 2 through the end
      rows.push({
        id: uid("task"), name: lbTask.name, description: lbTask.description,
        hoursBase: menuTaskHours(lbTask) || 1, multiplier: 1, months: lbMonths,
        sourceMenuId: "link-building", linkedRemediationIds: [], isContentTask: false, isSupplementary: true
      });
    }
  }

  return rows;
}

function buildBucketRows(){
  var duration = state.setup.duration;
  var split = currentImplementationTotals();
  return BUCKET_DEFAULT_TASKS.map(function(def){
    var menuTask = findMenuTask(def.menuId);
    if(!menuTask) return null;
    var multiplier;
    if(def.menuId === "impl-technical" || def.menuId === "impl-content"){
      // Accumulated from the routing rules: each finding contributes its rule's increment
      // (schema +2, page speed +3, heading structure +1 content, XML sitemap +1, and +1 for
      // every other Technical / Linking & Equity finding).
      var count = (def.menuId === "impl-technical") ? split.technical : split.content;
      multiplier = Math.max(0.25, count);
    } else {
      multiplier = Math.max(0.25, round2(def.perColumn * duration * currentDurationOption().factor));
    }
    return {
      id: uid("bucket"),
      name: menuTask.name,
      description: menuTask.description,
      hoursBase: menuTaskHours(menuTask) || 1,
      multiplier: multiplier,
      months: newMonthsArray(duration, def.months),
      sourceMenuId: def.menuId,
      linkedRemediationIds: []
    };
  }).filter(Boolean);
}

// Nudges the flexible catch-all bucket tasks (Ad Hoc, Implementation - Content, Implementation -
// Technical) so Estimated Points lands as close as possible to Total Project Points (Monthly
// Points x Duration). The gap is spread across these three rather than dumped into one line, so
// the result still reads like a believable allocation of time. The two implementation buckets
// split their share in proportion to how many findings actually routed to each, so a
// technical-heavy audit doesn't end up with inflated content implementation time.
function flexBudgetTargets(bucketRows){
  var split = currentImplementationTotals();
  var implTotal = split.technical + split.content;
  var techShare = implTotal ? (split.technical / implTotal) : 0.5;
  return [
    {menuId: "ad-hoc", weight: 0.4},
    {menuId: "impl-technical", weight: 0.6 * techShare},
    {menuId: "impl-content", weight: 0.6 * (1 - techShare)}
  ];
}

// Evens out the per-month point load by relocating movable single-month tasks from the
// heaviest month to the lightest. Foundation tasks (month 1), content tasks, and multi-month
// spans stay put. Runs before the AI pass so even a draft that never gets polished is close.
function levelMonthlyLoad(coreRows, bucketRows){
  var duration = state.setup.duration;
  if(duration < 2) return;
  var target = pointsPerColumn();
  if(!target) return;

  function loadsFor(){
    var loads = [];
    for(var i=0;i<duration;i++) loads.push(0);
    coreRows.concat(bucketRows).forEach(function(t){
      var activeCount = t.months.filter(Boolean).length;
      if(!activeCount) return;
      var per = (t.hoursBase * t.multiplier) / activeCount;
      t.months.forEach(function(active, i){ if(active && i < duration) loads[i] += per; });
    });
    return loads;
  }

  var movable = coreRows.filter(function(t){
    // Rule-fixed placements (foundation month 1, Homepage Optimization month 1, Site Speed
    // month 2) and multi-month spans stay put.
    if(t.isFoundation || t.isContentTask) return false;
    if(t.sourceMenuId === "homepage-opt" || t.sourceMenuId === "site-speed") return false;
    return t.months.filter(Boolean).length === 1;
  });
  if(movable.length === 0) return;

  // Greedy: repeatedly take the heaviest month's largest movable task and drop it on the
  // lightest month, as long as doing so actually narrows the spread.
  for(var pass=0; pass<40; pass++){
    var loads = loadsFor();
    var byLoad = [];
    for(var i=0;i<duration;i++) byLoad.push(i);
    byLoad.sort(function(a,b){ return loads[b] - loads[a]; }); // heaviest first
    var minI = byLoad[byLoad.length - 1];

    var moved = false;
    // Try each month from heaviest down as the donor; the heaviest may hold nothing movable.
    for(var d=0; d<byLoad.length-1 && !moved; d++){
      var maxI = byLoad[d];
      var spreadBefore = loads[maxI] - loads[minI];
      if(spreadBefore <= target * 0.1) break;

      var candidates = movable.filter(function(t){ return t.months[maxI]; });
      if(candidates.length === 0) continue;
      candidates.sort(function(a,b){
        return (b.hoursBase * b.multiplier) - (a.hoursBase * a.multiplier);
      });
      for(var c=0;c<candidates.length;c++){
        var cost = candidates[c].hoursBase * candidates[c].multiplier;
        var newSpread = Math.abs((loads[maxI] - cost) - (loads[minI] + cost));
        if(newSpread < spreadBefore){
          candidates[c].months[maxI] = false;
          candidates[c].months[minI] = true;
          moved = true;
          break;
        }
      }
    }
    if(!moved){
      // Secondary strategy: if the heaviest month is carrying a content task that runs in only
      // a few months, widen its span forward. Content still starts where it started, but its
      // per-month cost drops, which pulls the spike down without violating the start rule.
      var heavy = byLoad[0];
      if(loads[heavy] - loads[minI] > target * 0.1){
        var widenable = coreRows.filter(function(t){
          return t.isContentTask && t.months[heavy] && t.months.filter(Boolean).length < duration - 1;
        });
        for(var w=0; w<widenable.length && !moved; w++){
          var t = widenable[w];
          var last = -1;
          for(var mi=0; mi<duration; mi++){ if(t.months[mi]) last = mi; }
          if(last >= 0 && last + 1 < duration){
            t.months[last + 1] = true;
            moved = true;
          }
        }
      }
    }
    if(!moved) break;
  }
}

// How far past its rule-derived base an Implementation bucket may be inflated when closing the
// budget gap. The routing rules set those multipliers deliberately, so letting the balancer
// triple them would bury the intent; overflow goes to Ad Hoc instead.
var IMPL_INFLATION_CAP = 2;

function closeBudgetGap(coreRows, bucketRows){
  var duration = state.setup.duration;
  var projectPoints = totalProjectPoints();
  var allRows = coreRows.concat(bucketRows);
  var currentTotal = allRows.reduce(function(sum, t){ return sum + (t.hoursBase * t.multiplier); }, 0);
  var gap = projectPoints - currentTotal;
  if(!gap) return;

  var targets = [];
  flexBudgetTargets(bucketRows).forEach(function(f){
    if(f.weight <= 0) return;
    var row = null;
    for(var i=0;i<bucketRows.length;i++){ if(bucketRows[i].sourceMenuId === f.menuId){ row = bucketRows[i]; break; } }
    if(row && row.hoursBase) targets.push({row: row, weight: f.weight, menuId: f.menuId, base: row.multiplier});
  });
  if(targets.length === 0) return;

  var adHoc = null;
  targets.forEach(function(t){ if(t.menuId === "ad-hoc") adHoc = t; });

  // Over budget: drain Ad Hoc first, then trim the Implementation buckets, but never below half
  // their rule-derived value. Zeroing them out would erase the routing rules' intent and make
  // the roadmap look broken rather than over-scoped.
  if(gap < 0){
    var deficit = -gap;
    if(adHoc && adHoc.row.hoursBase){
      var adHocPoints = adHoc.row.multiplier * adHoc.row.hoursBase;
      var takeFromAdHoc = Math.min(deficit, adHocPoints);
      adHoc.row.multiplier = round2(adHoc.row.multiplier - (takeFromAdHoc / adHoc.row.hoursBase));
      deficit -= takeFromAdHoc;
    }
    if(deficit > 0){
      var implTargets = targets.filter(function(t){ return t.menuId !== "ad-hoc" && t.row.hoursBase; });
      var reducible = implTargets.reduce(function(s,t){ return s + (t.base * 0.5 * t.row.hoursBase); }, 0);
      if(reducible > 0){
        var ratio = Math.min(1, deficit / reducible);
        implTargets.forEach(function(t){
          var reduction = t.base * 0.5 * ratio;
          t.row.multiplier = Math.max(round2(t.base * 0.5), round2(t.row.multiplier - reduction));
        });
      }
    }
    return;
  }

  var weightSum = targets.reduce(function(s,t){ return s + t.weight; }, 0);
  var overflow = 0;
  targets.forEach(function(t){
    var share = gap * (t.weight / weightSum);
    var adjusted = t.row.multiplier + (share / t.row.hoursBase);
    if(t.menuId !== "ad-hoc" && gap > 0){
      var ceiling = t.base * IMPL_INFLATION_CAP;
      if(adjusted > ceiling){
        overflow += (adjusted - ceiling) * t.row.hoursBase;
        adjusted = ceiling;
      }
    }
    t.row.multiplier = Math.max(0, round2(adjusted));
  });

  // Whatever the capped buckets couldn't absorb lands in Ad Hoc, which is the line that exists
  // precisely to hold unallocated time.
  if(overflow > 0 && adHoc && adHoc.row.hoursBase){
    adHoc.row.multiplier = Math.max(0, round2(adHoc.row.multiplier + (overflow / adHoc.row.hoursBase)));
  }
}

/* ============================== ANTHROPIC API (AI POLISH + DRIVE MCP) ============================== */
async function callClaude(userText, mcpServers, maxTokens){
  var body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTokens || 4000,
    messages: [{role:"user", content: userText}]
  };
  if(mcpServers && mcpServers.length) body.mcp_servers = mcpServers;
  var resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  var data = await resp.json();
  var textBlocks = (data.content || []).filter(function(b){ return b.type === "text"; }).map(function(b){ return b.text; });
  return {raw: data, text: textBlocks.join("\n")};
}

function extractJson(text){
  if(!text) return null;
  var cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  var start = cleaned.indexOf("[");
  var startObj = cleaned.indexOf("{");
  if(start === -1 || (startObj !== -1 && startObj < start)) start = startObj;
  var end = Math.max(cleaned.lastIndexOf("]"), cleaned.lastIndexOf("}"));
  if(start === -1 || end === -1) return null;
  try{ return JSON.parse(cleaned.slice(start, end+1)); }catch(e){ return null; }
}

function extractDriveFileId(url){
  if(!url) return null;
  var m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  var m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return m2[1];
  if(/^[a-zA-Z0-9_-]{20,}$/.test(url.trim())) return url.trim();
  return null;
}

      (state.setup.roadmapType === "mrr" ? " For this Ongoing MRR roadmap they should continue through the final month.\n" : "\n") +

          row.activeMonths.forEach(function(m){ if(m >= 1 && m <= duration) months[m-1] = true; });
          // Re-assert the hard constraints in case the model drifted from them.
          if(t.isFoundation){
            months = newMonthsArray(duration, "none");
            months[0] = true;
          } else if(t.sourceMenuId === "homepage-opt"){
            months = newMonthsArray(duration, "none");

            months[Math.min(1, duration - 1)] = true;
          } else if(t.isContentTask && duration >= 2){
            if(state.setup.roadmapType === "mrr"){
              // Documented rule: MRR content work starts in month 2 and runs to the end.
              months = newMonthsArray(duration, "none");
              for(var cm = 1; cm < duration; cm++) months[cm] = true;
            } else {
              months[0] = false;
              if(!months.some(Boolean)) months[1] = true;
            }
          }
          if(!months.some(Boolean)) months[Math.min(1, duration - 1)] = true;
          t.months = months;
        }
      });
      state.roadmap.core.sort(function(a,b){
        var oa = (byId[a.id] && byId[a.id].order) || 999;
        var ob = (byId[b.id] && byId[b.id].order) || 999;
        return oa - ob;
      });
      var spreadBefore = monthlySpreadPct();
      // The AI owns sequencing; leveling is a safety net that only engages if its plan left
      // months lopsided (it no-ops when the spread is already inside 10%).
      levelMonthlyLoad(state.roadmap.core, state.roadmap.bucket);
      var spread = monthlySpreadPct();
      state.aiLog = "AI polish pass applied across " + json.length + " tasks. Monthly load now within " +
        spread + "% of the " + round2(pointsPerColumn()) + "-point target (" + monthlyLoads().join(", ") + ")." +
        (spreadBefore > spread ? " Leveling corrected an uneven month spread." : "");
    }
  }catch(e){
    console.error(e);
    state.aiLog = "AI polish pass failed - the rules-based draft is unchanged.";
  }
  state.aiBusy = false;
  render();
}

function csvEscape(v){
  v = (v === null || v === undefined) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

/* ============================== XLSX GENERATION ============================== */
// An .xlsx is a ZIP of XML parts. Building one directly (rather than shipping a CSV) is what
// lets the pushed file carry real formatting - brand colors, merged title block, month fills,
// frozen header - which Drive preserves when it converts the upload to a native Sheet.

var CRC_TABLE = (function(){
  var table = new Array(256);
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes){
  var c = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function utf8Bytes(str){
  if(typeof TextEncoder !== "undefined") return new TextEncoder().encode(str);
  var utf8 = unescape(encodeURIComponent(str));
  var out = new Uint8Array(utf8.length);
  for(var i=0;i<utf8.length;i++) out[i] = utf8.charCodeAt(i);
  return out;
}

// Entries are STORED (uncompressed). Valid ZIP, and every xlsx reader accepts it, which avoids
// pulling in a deflate implementation.
function buildZip(files){
  var chunks = [];
  var central = [];
  var offset = 0;

  function u16(v){ return [v & 0xFF, (v >>> 8) & 0xFF]; }
  function u32(v){ return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }

  files.forEach(function(f){
    var nameBytes = utf8Bytes(f.name);
    var dataBytes = utf8Bytes(f.content);
    var crc = crc32(dataBytes);

    var local = []
      .concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
              u32(crc), u32(dataBytes.length), u32(dataBytes.length),
              u16(nameBytes.length), u16(0));
    chunks.push(new Uint8Array(local));
    chunks.push(nameBytes);
    chunks.push(dataBytes);

    central.push({
      name: nameBytes, crc: crc, size: dataBytes.length, offset: offset
    });
    offset += local.length + nameBytes.length + dataBytes.length;
  });

  var centralStart = offset;
  var centralChunks = [];
  central.forEach(function(e){
    var head = []
      .concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
              u32(e.crc), u32(e.size), u32(e.size),
              u16(e.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(e.offset));
    centralChunks.push(new Uint8Array(head));
    centralChunks.push(e.name);
    offset += head.length + e.name.length;
  });

  var end = [].concat(u32(0x06054b50), u16(0), u16(0),
    u16(central.length), u16(central.length),
    u32(offset - centralStart), u32(centralStart), u16(0));
  centralChunks.push(new Uint8Array(end));

  var all = chunks.concat(centralChunks);
  var totalLength = all.reduce(function(s, c){ return s + c.length; }, 0);
  var out = new Uint8Array(totalLength);
  var pos = 0;
  all.forEach(function(c){ out.set(c, pos); pos += c.length; });
  return out;
}

function bytesToBase64(bytes){
  var binary = "";
  var chunkSize = 0x8000;
  for(var i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function xmlEscape(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
    // Strip control characters Excel rejects.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
}

function colLetter(index){
  var s = "";
  index += 1;
  while(index > 0){
    var rem = (index - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    index = Math.floor((index - 1) / 26);
  }
  return s;
}

// Cell helpers. Numbers are written as numeric so Sheets can sum them; everything else goes in
// as an inline string, which avoids maintaining a shared-string table.
function cellXml(ref, value, styleIdx, forceText){
  var s = ' s="' + styleIdx + '"';
  if(value === "" || value === null || value === undefined) return '<c r="' + ref + '"' + s + '/>';
  if(!forceText && typeof value === "number" && isFinite(value)){
    return '<c r="' + ref + '"' + s + '><v>' + value + '</v></c>';
  }
  return '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
}

function buildRoadmapWorkbook(){
  var duration = state.setup.duration;
  var setup = state.setup;
  var unit = setup.unitLabel;

  // Column layout: # | Task | Points | months... | Description | Mult
  var monthStart = 3;
  var descCol = monthStart + duration;
  var multCol = descCol + 1;
  var lastCol = multCol;

  var rows = [];   // {cells:[{v,s,text}], height}
  var merges = [];
  var rowIdx = 0;

  function addRow(cells, height){
    rows.push({cells: cells, height: height});
    return ++rowIdx; // 1-based row number just written
  }
  function blank(){ return addRow([]); }
  function mergeAcross(rowNum, fromCol, toCol){
    merges.push(colLetter(fromCol) + rowNum + ':' + colLetter(toCol) + rowNum);
  }

  // ---- Title block ----
  var titleRow = addRow([{c:0, v: setup.clientName || "Untitled Client", s: S.TITLE}], 26);
  mergeAcross(titleRow, 0, Math.min(4, lastCol));

  var typeName = (ROADMAP_TYPES.find(function(r){ return r.id === setup.roadmapType; }) || {}).name || "";
  var subtitle = [typeName, currentDurationOption().label, setup.domain].filter(Boolean).join("  \u00B7  ");
  var subRow = addRow([{c:0, v: subtitle, s: S.SUBTITLE}], 16);
  mergeAcross(subRow, 0, Math.min(6, lastCol));

  // Meta labels live in the narrow index column, so merge each across A:B to give them room.
  var metaPairs = [
    ["Monthly " + unit + ":", Number(setup.monthlyHours) || 0],
    ["Monthly Budget:", "$" + Number(setup.monthlyBudget).toLocaleString()],
    ["Page Count:", Number(setup.pageCount) || 0],
    ["Total Project " + unit + ":", totalProjectPoints()]
  ];
  metaPairs.forEach(function(pair){
    var r = addRow([
      {c:0, v: pair[0], s: S.META_LABEL},
      {c:1, v: "", s: S.META_LABEL},
      {c:2, v: pair[1], s: S.META_VALUE}
    ], 15);
    mergeAcross(r, 0, 1);
  });
  blank();

  // ---- Header band ----
  var headerCells = [
    {c:0, v:"#", s:S.HEADER_MONTH},
    {c:1, v:"Task Name", s:S.HEADER},
    {c:2, v:unit, s:S.HEADER_MONTH}
  ];
  for(var m=0;m<duration;m++) headerCells.push({c: monthStart + m, v: columnLabel(m, true), s: S.HEADER_MONTH});
  headerCells.push({c: descCol, v:"Task Description", s:S.HEADER});
  headerCells.push({c: multCol, v:"Volume", s:S.HEADER_MONTH});
  var headerRowNum = addRow(headerCells, 22);

  // ---- Task sections ----
  function pushSection(title, tasks, startIdx){
    var secRow = addRow([{c:0, v: title, s: S.SECTION}], 18);
    for(var c=0;c<=lastCol;c++){
      if(c > 0) rows[secRow-1].cells.push({c:c, v:"", s:S.SECTION});
    }
    tasks.forEach(function(t, i){
      var cells = [
        {c:0, v: startIdx + i, s:S.IDX},
        {c:1, v: t.name, s:S.TASK},
        {c:2, v: round2(t.hoursBase * t.multiplier), s:S.POINTS}
      ];
      t.months.forEach(function(active, mi){
        cells.push({c: monthStart + mi, v: "", s: active ? S.MONTH_ON : S.MONTH_OFF});
      });
      cells.push({c: descCol, v: t.description || "", s:S.DESC});
      cells.push({c: multCol, v: t.multiplier, s:S.MULT});
      addRow(cells, 30);
    });
    return startIdx + tasks.length;
  }

  var next = pushSection(state.setup.roadmapType === "migration" ? "Migration Tasks" : "Core Tasks", state.roadmap.core, 1);
  pushSection("Communication / Implementation / Misc. / Ad Hoc", state.roadmap.bucket, next);

  // ---- Points by month ----
  blank();
  var loads = monthlyLoads();
  var loadCells = [{c:1, v: unit + " by Month", s:S.LOAD_LABEL}, {c:2, v:"", s:S.LOAD_LABEL}];
  loads.forEach(function(l, i){ loadCells.push({c: monthStart + i, v: l, s:S.LOAD_VALUE}); });
  addRow(loadCells, 18);

  // ---- Totals ----
  blank();
  addRow([
    {c:1, v:"Estimated " + unit + ":", s:S.TOTAL_LABEL},
    {c:2, v: totalEstimatedHours(), s:S.TOTAL_VALUE}
  ], 20);
  addRow([
    {c:1, v:"Total Project " + unit + ":", s:S.TOTAL_LABEL},
    {c:2, v: totalProjectPoints(), s:S.TOTAL_VALUE}
  ], 20);

  // ---- Serialize sheet ----
  var cols = '<cols>' +
    '<col min="1" max="1" width="5" customWidth="1"/>' +
    '<col min="2" max="2" width="40" customWidth="1"/>' +
    '<col min="3" max="3" width="9" customWidth="1"/>' +
    '<col min="' + (monthStart+1) + '" max="' + (monthStart+duration) + '" width="6" customWidth="1"/>' +
    '<col min="' + (descCol+1) + '" max="' + (descCol+1) + '" width="62" customWidth="1"/>' +
    '<col min="' + (multCol+1) + '" max="' + (multCol+1) + '" width="9" customWidth="1"/>' +
  '</cols>';

  var sheetRows = rows.map(function(r, i){
    var rowNum = i + 1;
    var cellsXml = r.cells
      .slice()
      .sort(function(a,b){ return a.c - b.c; })
      .map(function(cell){ return cellXml(colLetter(cell.c) + rowNum, cell.v, cell.s == null ? S.DEFAULT : cell.s); })
      .join("");
    var ht = r.height ? ' ht="' + r.height + '" customHeight="1"' : '';
    return '<row r="' + rowNum + '"' + ht + '>' + cellsXml + '</row>';
  }).join("");

  var mergeXml = merges.length
    ? '<mergeCells count="' + merges.length + '">' + merges.map(function(m){ return '<mergeCell ref="' + m + '"/>'; }).join("") + '</mergeCells>'
    : '';

  var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetPr><outlinePr summaryBelow="1" summaryRight="1"/></sheetPr>' +
    '<sheetViews><sheetView workbookViewId="0" showGridLines="0">' +
      '<pane ySplit="' + headerRowNum + '" topLeftCell="A' + (headerRowNum+1) + '" activePane="bottomLeft" state="frozen"/>' +
    '</sheetView></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    cols +
    '<sheetData>' + sheetRows + '</sheetData>' +
    mergeXml +
    '</worksheet>';

  var sheetName = xmlEscape((setup.clientName || "Roadmap").slice(0, 28)) || "Roadmap";

  var files = [
    {name: "[Content_Types].xml", content:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>'},
    {name: "_rels/.rels", content:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>'},
    {name: "xl/workbook.xml", content:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + sheetName + '" sheetId="1" r:id="rId1"/></sheets>' +
      '</workbook>'},
    {name: "xl/_rels/workbook.xml.rels", content:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>'},
    {name: "xl/styles.xml", content: stylesXml()},
    {name: "xl/worksheets/sheet1.xml", content: sheet}
  ];

  return buildZip(files);
}

function roadmapFileTitle(){

}

function downloadXlsx(){
  var bytes = buildRoadmapWorkbook();
  var blob = new Blob([bytes], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = roadmapFileTitle().replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".xlsx";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildExportRows(){
  var duration = state.setup.duration;
  var monthHeaders = [];
  for(var m=0;m<duration;m++) monthHeaders.push(columnLabel(m, false));
  var header = ["#","Task Name","Points"].concat(monthHeaders).concat(["Task Description","Volume Multiplier"]);
  var rows = [header];

  function pushSection(title, tasks, startIdx){
    rows.push([title].concat(new Array(header.length - 1).fill("")));
    tasks.forEach(function(t, i){
      var total = round2(t.hoursBase * t.multiplier);
      var row = [startIdx + i, t.name, total];
      t.months.forEach(function(active){ row.push(active ? "-" : ""); });
      row.push(t.description);
      row.push(t.multiplier);
      rows.push(row);
    });
    return startIdx + tasks.length;
  }

  var next = pushSection(state.setup.roadmapType === "migration" ? "Migration Tasks" : "Core Tasks", state.roadmap.core, 1);
  pushSection("Communication / Implementation / Misc. / Ad Hoc", state.roadmap.bucket, next);

  var estHours = totalEstimatedHours();
  var totalHours = totalProjectPoints();
  rows.push([]);
  rows.push(["", "Estimated " + state.setup.unitLabel + ":", estHours]);
  rows.push(["", "Total Project " + state.setup.unitLabel + ":", totalHours]);
  return rows;
}

function downloadCsv(){
  var rows = buildExportRows();
  var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var slug = currentDurationOption().label.replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  var fname = (state.setup.clientName || "client").replace(/[^a-z0-9]+/gi,"-").toLowerCase() + "-" + slug + "-roadmap.csv";
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function totalEstimatedHours(){
  var all = state.roadmap.core.concat(state.roadmap.bucket);
  var sum = 0;
  all.forEach(function(t){ sum += (t.hoursBase * t.multiplier); });
  return round2(sum);
}

// A task's points are spread evenly across the months it's active in, so a 12-point task
// running three months costs 4 points in each of those months.
function taskMonthlyLoad(t){
  var activeCount = t.months.filter(Boolean).length;
  if(!activeCount) return 0;
  return (t.hoursBase * t.multiplier) / activeCount;
}

// Per-column point load across the whole roadmap (core + bucket).
function monthlyLoads(){
  var duration = state.setup.duration;
  var loads = [];
  for(var i=0;i<duration;i++) loads.push(0);
  state.roadmap.core.concat(state.roadmap.bucket).forEach(function(t){
    var per = taskMonthlyLoad(t);
    t.months.forEach(function(active, i){ if(active && i < duration) loads[i] += per; });
  });
  return loads.map(round2);
}

// How far the worst month sits from the per-month target, as a percentage.
function monthlySpreadPct(){
  var target = pointsPerColumn();
  if(!target) return 0;
  var loads = monthlyLoads();
  var worst = 0;
  loads.forEach(function(l){ worst = Math.max(worst, Math.abs(l - target)); });
  return Math.round((worst / target) * 100);
}

async function pushRoadmapToDrive(folderId){
  state.driveBusy = true;
  state.driveLog = "";
  render();
  try{
    var bytes = buildRoadmapWorkbook();
    var base64 = bytesToBase64(bytes);
    var title = roadmapFileTitle();

    // Uploading .xlsx rather than CSV is what carries the formatting through: Drive converts
    // the workbook to a native Sheet and keeps fills, merges, column widths, and the frozen
    // header row.
    var parentClause = folderId
      ? " Set parentId to \"" + folderId + "\" so it lands in that folder."
      : "";
    var prompt = "Use the Google Drive tool to create a file by calling create_file with these exact arguments:\n" +
      "- title: \"" + title + "\"\n" +
      "- contentMimeType: \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\n" +
      "- disableConversionToGoogleType: false\n" +
      "- base64Content: the base64 string provided below\n" +
      parentClause + "\n\n" +
      "Do not modify, re-encode, truncate, or reformat the base64 string. Pass it through exactly as given.\n\n" +
      "BASE64 CONTENT:\n" + base64 + "\n\n" +
      "After the file is created, reply with ONLY its webViewLink URL and nothing else. " +
      "If the call fails, reply with ONLY the word ERROR followed by the error message.";

    var mcp = [{type:"url", url:"https://drivemcp.googleapis.com/mcp/v1", name:"google-drive"}];
    var result = await callClaude(prompt, mcp, 2000);
    var text = (result.text || "").trim();

    var linkMatch = text.match(/https?:\/\/[^\s"'<>)]+/);
    if(linkMatch){
      state.driveLog = "Created: " + linkMatch[0];
      state.driveLogUrl = linkMatch[0];
      state.driveLogWarn = false;
    } else {
      state.driveLog = text
        ? "Drive didn't return a link. Response: " + text.slice(0, 300)
        : "Drive didn't return a link. Download the XLSX and upload it manually.";
      state.driveLogUrl = "";
      state.driveLogWarn = true;
    }
  }catch(e){
    console.error(e);
    state.driveLog = "Couldn't push to Google Drive. Download the XLSX instead and upload it to Drive yourself.";
    state.driveLogUrl = "";
    state.driveLogWarn = true;
  }
  state.driveBusy = false;
  render();
}

function pill(value){

  var c = map[value.toLowerCase()] || "";
  return '<span class="r-pill ' + c + '">' + esc(value) + '</span>';
}

// Ad Hoc is the line that absorbs whatever the identified work doesn't fill. When it dominates,
// that means the remediation list doesn't justify the retainer, which is worth saying out loud
// rather than quietly shipping a roadmap that's mostly unallocated time.
function renderAllocationWarning(){
  if(state.roadmap.core.length + state.roadmap.bucket.length === 0) return '';
  var total = totalProjectPoints();
  if(!total) return '';
  var adHoc = null;
  state.roadmap.bucket.forEach(function(t){ if(t.sourceMenuId === "ad-hoc") adHoc = t; });
  if(!adHoc) return '';
  var adHocPoints = adHoc.hoursBase * adHoc.multiplier;
  var pct = Math.round((adHocPoints / total) * 100);
  if(pct < 25) return '';
  return '<div class="r-callout warn" style="margin-top:16px;"><strong>' + pct + '% of this roadmap is unallocated Ad Hoc time.</strong> ' +
    'The remediation list doesn\'t account for the full ' + total + '-point budget. Add more findings, pull in additional menu deliverables, ' +
    'or reduce Monthly Points so the plan reflects real scoped work.</div>';
}

    '<div class="r-spacer"></div></div>';

      '<div style="font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--slate);">' + columnLabel(i, true) + '</div>' +

      '<div style="font-size:9.5px; color:' + color + ';">' + (deltaPct > 0 ? "+" : "") + deltaPct + '%</div>' +

  return html;
}

/* ============================== EVENTS ============================== */
function setByPath(obj, path, value){
  var parts = path.split(".");
  var cur = obj;
  for(var i=0;i<parts.length-1;i++){
    var key = /^\d+$/.test(parts[i]) ? parseInt(parts[i],10) : parts[i];
    cur = cur[key];
  }
  var lastKey = /^\d+$/.test(parts[parts.length-1]) ? parseInt(parts[parts.length-1],10) : parts[parts.length-1];
  cur[lastKey] = value;
}

function coerceValue(input){
  if(input.type === "number") return input.value === "" ? null : parseFloat(input.value);
  return input.value;
}

function attachDelegatedEvents(){
  root.querySelectorAll("[data-bind]").forEach(function(el){
    var evt = (el.tagName === "SELECT" || el.type === "checkbox") ? "change" : "input";
    el.addEventListener(evt, function(){
      var path = el.getAttribute("data-bind");
      setByPath(state, path, coerceValue(el));
      // Live-sync computed hours cell without a full re-render (keeps focus in text fields)
      if(path.indexOf("roadmap.") === 0) syncRowTotal(el);
      if(path === "setup.monthlyHours" || path === "setup.ratePerPoint") syncBudgetReadout();
    });
    // Full re-render on blur for fields that affect layout (menu name changes elsewhere, etc.) is skipped
    // to avoid losing focus/cursor position while typing.
  });

  var csvInput = root.querySelector("#r-csv-input");
  if(csvInput){
    csvInput.addEventListener("change", function(){
      var file = csvInput.files && csvInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        handleCsvImport(String(reader.result), file.name);
      };
      reader.onerror = function(){
        state.importLog = "Couldn't read that file. Make sure it's a plain .csv export.";
        state.importLogWarn = true;
        render();
      };
      reader.readAsText(file);
    });
  }

  var roadmapInput = root.querySelector("#r-roadmap-import");
  if(roadmapInput){
    roadmapInput.addEventListener("change", function(){
      var file = roadmapInput.files && roadmapInput.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){ importRoadmapFile(String(reader.result), file.name); };
      reader.onerror = function(){ alert("Couldn't read that file."); };
      reader.readAsText(file);
    });
  }

  var modalSearch = root.querySelector("#r-modal-search");
  if(modalSearch){
    modalSearch.addEventListener("input", function(){
      state.modal.search = modalSearch.value;
      render();
      setTimeout(function(){
        var el = root.querySelector("#r-modal-search");
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      }, 0);
    });
  }

  root.querySelectorAll("[data-action]").forEach(function(el){
    el.addEventListener("click", function(e){
      handleAction(el.getAttribute("data-action"), el, e);
    });
  });
}

function syncRowTotal(el){
  var path = el.getAttribute("data-bind");
  var m = path.match(/^roadmap\.(core|bucket)\.(\d+)\.(multiplier|hoursBase)$/);
  if(!m) return;
  var target = m[1], idx = parseInt(m[2],10);
  var t = state.roadmap[target][idx];
  var row = el.closest("tr");
  if(row){
    var cell = row.children[3];
    if(cell) cell.textContent = round2(t.hoursBase * t.multiplier);
  }
  var totalEl = root.querySelector(".r-total-value");
  if(totalEl) totalEl.textContent = totalEstimatedHours();
}

function syncBudgetReadout(){
  recalcMonthlyBudget();
  var el = root.querySelector("#r-budget-readout");
  if(el) el.textContent = "$" + Number(state.setup.monthlyBudget).toLocaleString();
}

function handleCsvImport(text, filename){
  var result;
  try{
    result = parseRemediationCsv(text);
  }catch(e){
    console.error(e);
    state.importLog = "Couldn't parse " + filename + ". Make sure it's a plain CSV export.";
    state.importLogWarn = true;
    render();
    return;
  }

  if(result.items.length === 0){
    state.importLog = "No rows imported from " + filename + ". Every row needs a value in the ISSUE column. " +
      (result.foundHeader ? "A header row was found, so check that the ISSUE column isn't empty."
                          : "No header row was recognized \u2014 check that the file includes column names.");
    state.importLogWarn = true;
    render();
    return;
  }

  state.remediation = state.remediation.concat(result.items);
  var msg = "Imported " + result.items.length + " row" + (result.items.length === 1 ? "" : "s") + " from " + filename + ".";
  if(result.skipped) msg += " Skipped " + result.skipped + " row" + (result.skipped === 1 ? "" : "s") + " with no ISSUE value.";
  var missing = summarizeMissingFields(result.items);
  if(missing) msg += " " + missing;
  state.importLog = msg;
  state.importLogWarn = !!result.skipped || !!missing;
  render();
}

// Flags fields that came through empty across many rows, which usually means a column didn't
// line up rather than that the data is genuinely blank.
function summarizeMissingFields(items){
  var checks = [
    {key:"area", label:"AREA"},
    {key:"difficulty", label:"DIFFICULTY"},
    {key:"impact", label:"POTENTIAL IMPACT"}
  ];
  var gaps = [];
  checks.forEach(function(c){
    var blank = items.filter(function(it){ return !it[c.key]; }).length;
    if(blank === items.length) gaps.push(c.label + " (all rows)");
    else if(blank > items.length / 2) gaps.push(c.label + " (" + blank + " of " + items.length + ")");
  });
  if(gaps.length === 0) return "";
  return "Heads up, these came through blank: " + gaps.join(", ") + ". Impact and Difficulty drive prioritization, so check the column mapping if that looks wrong.";
}

/* ============================== MONTH GROUPING ============================== */
// Reorders core tasks so the document reads in the order work actually happens: everything
// starting in month 1, then month 2, and so on. Ties keep their existing relative order, and
// within a month, shorter engagements come before long-running spans so one-off work reads
// first and ongoing work trails it.
function groupTasksByMonth(){
  function firstActiveMonth(t){
    for(var i=0;i<t.months.length;i++){ if(t.months[i]) return i; }
    return 999;
  }
  function span(t){ return t.months.filter(Boolean).length; }

  var indexed = state.roadmap.core.map(function(t, i){ return {task: t, i: i}; });
  indexed.sort(function(a, b){
    var ma = firstActiveMonth(a.task), mb = firstActiveMonth(b.task);
    if(ma !== mb) return ma - mb;
    var sa = span(a.task), sb = span(b.task);
    if(sa !== sb) return sa - sb;
    return a.i - b.i; // stable for genuine ties
  });
  state.roadmap.core = indexed.map(function(e){ return e.task; });
}

/* ============================== ROADMAP FILE EXPORT / IMPORT ============================== */
var ROADMAP_FILE_VERSION = 1;

function buildRoadmapFile(){
  return {
    fileType: "obx-seo-roadmap",
    version: ROADMAP_FILE_VERSION,
    savedAt: new Date().toISOString(),
    setup: state.setup,
    tier: null,
    remediation: state.remediation,
    remediationSourceUrl: state.remediationSourceUrl,
    remediationTabName: state.remediationTabName,
    roadmap: state.roadmap,
    menu: state.menu,
    migrationMenu: state.migrationMenu
  };
}

function exportRoadmapFile(){
  var payload = JSON.stringify(buildRoadmapFile(), null, 2);
  var blob = new Blob([payload], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var slug = (state.setup.clientName || "client").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  a.href = url;
  a.download = slug + "-roadmap.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.saveStatus = "Exported " + a.download;
  renderSaveStatus();
}

function importRoadmapFile(text, filename){
  var data;
  try{
    data = JSON.parse(text);
  }catch(e){
    alert("Couldn't read " + filename + " - it isn't valid JSON. Use a file created by Export Roadmap.");
    return;
  }
  if(!data || data.fileType !== "obx-seo-roadmap"){
    alert("That doesn't look like an exported roadmap file. Use a file created by Export Roadmap.");
    return;
  }
  if(!confirm("Load " + filename + "? This replaces the current setup, remediation list, and roadmap.")) return;

  if(data.setup) state.setup = Object.assign({}, state.setup, data.setup);
  if(Array.isArray(data.remediation)) state.remediation = data.remediation;
  if(typeof data.remediationSourceUrl === "string") state.remediationSourceUrl = data.remediationSourceUrl;
  if(typeof data.remediationTabName === "string") state.remediationTabName = data.remediationTabName;
  if(Array.isArray(data.menu) && data.menu.length) state.menu = data.menu;
  if(Array.isArray(data.migrationMenu) && data.migrationMenu.length) state.migrationMenu = data.migrationMenu;

  if(data.roadmap && Array.isArray(data.roadmap.core) && Array.isArray(data.roadmap.bucket)){
    state.roadmap = {core: data.roadmap.core, bucket: data.roadmap.bucket};
  }

  // Older files may predate the duration-option ids, and a hand-edited file could carry month
  // arrays that don't match its own duration. Reconcile both against the current setup.
  var opts = durationOptions();
  var valid = opts.some(function(o){ return o.id === state.setup.durationId; });
  if(!valid){
    var byColumns = null;
    for(var i=0;i<opts.length;i++){ if(opts[i].columns === state.setup.duration && opts[i].factor === 1){ byColumns = opts[i]; break; } }
    state.setup.durationId = (byColumns ? byColumns : opts[0]).id;
  }
  var columns = currentDurationOption().columns;
  state.setup.duration = columns;
  state.roadmap.core.forEach(function(t){ t.months = resizeMonthsArray(t.months || [], columns); });
  state.roadmap.bucket.forEach(function(t){ t.months = resizeMonthsArray(t.months || [], columns); });

  recalcMonthlyBudget();
  lastRemediationPlan = null; // recompute implementation totals from the imported findings
  state.importLog = "Loaded " + filename + " (" + state.remediation.length + " remediation rows, " +
    (state.roadmap.core.length + state.roadmap.bucket.length) + " tasks).";
  state.importLogWarn = false;
  state.saveStatus = "Imported " + filename;
  state.activeTab = "roadmap";
  render();
}

// Resets everything project-specific while leaving the SEO Menu alone - menu edits are a
// standing configuration, not part of any one client's roadmap.
async function clearProject(){
  state.setup = {
    clientName: "",
    domain: "",
    pageCount: 100,
    monthlyHours: 30,
    ratePerPoint: 200,
    monthlyBudget: 6000,
    unitLabel: "Points",
    roadmapType: "mrr",
    duration: 6,
    durationId: "6m"
  };
  state.remediation = [];
  state.remediationSourceUrl = "";
  state.remediationTabName = "Score & SEO Issues";
  state.roadmap = {core: [], bucket: []};
  state.importLog = "";
  state.importLogWarn = false;
  state.aiLog = "";
  lastRemediationPlan = null;
  recalcMonthlyBudget();
  state.activeTab = "setup";
  state.saveStatus = "Project cleared";
  render();

  try{
    await window.storage.delete(STORAGE_KEY_DRAFT, false);
  }catch(e){ /* nothing saved yet, nothing to remove */ }
}

function handleAction(action, el, e){
  if(action === "set-tab"){ state.activeTab = el.getAttribute("data-tab"); render(); return; }
  if(action === "goto-tab"){ state.activeTab = el.getAttribute("data-tab"); render(); return; }
  if(action === "set-settings-subtab"){ state.settingsSubtab = el.getAttribute("data-tab"); render(); return; }

  if(action === "set-roadmap-type"){
    var prevSetKey = durationSetKey(state.setup.roadmapType);
    state.setup.roadmapType = el.getAttribute("data-value");
    var newSetKey = durationSetKey(state.setup.roadmapType);
    if(newSetKey !== prevSetKey){
      // The available durations changed. Keep the current pick if the new set offers the same
      // id (e.g. "3m" exists in both), otherwise fall back to that set's default.
      var opts = DURATION_SETS[newSetKey];
      var stillValid = opts.some(function(o){ return o.id === state.setup.durationId; });
      if(!stillValid) applyDurationOption(DURATION_SET_DEFAULT_ID[newSetKey]);
    }
    render(); return;
  }
  if(action === "set-duration"){
    applyDurationOption(el.getAttribute("data-value"));
    render(); return;
  }
  if(action === "add-menu-task"){
    state.menu.push({id:uid("menu"), name:"New Task", description:"", category:"Custom", points:1});
    saveMenuToStorage(); render(); return;
  }
  if(action === "remove-menu-task"){
    state.menu.splice(parseInt(el.getAttribute("data-idx"),10), 1);
    saveMenuToStorage(); render(); return;
  }
  if(action === "add-migration-task"){
    state.migrationMenu.push({id:uid("mig"), name:"New Phase Task", description:"", hours:1});
    saveMenuToStorage(); render(); return;
  }
  if(action === "remove-migration-task"){
    state.migrationMenu.splice(parseInt(el.getAttribute("data-idx"),10), 1);
    saveMenuToStorage(); render(); return;
  }
  if(action === "reset-menu"){
    if(confirm("Reset the SEO Menu back to the OuterBox default? Your edits in this tab will be lost.")){
      state.menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
      state.migrationMenu = JSON.parse(JSON.stringify(DEFAULT_MIGRATION_MENU));
      saveMenuToStorage(); render();
    }
    return;
  }

  if(action === "fetch-drive-remediation"){
    var urlInput = root.querySelector("#r-drive-url");
    var tabInput = root.querySelector("#r-drive-tab");
    state.remediationTabName = tabInput ? tabInput.value.trim() : "";
    fetchRemediationFromDrive(urlInput ? urlInput.value : "", state.remediationTabName);
    return;
  }
  if(action === "trigger-csv-upload"){
    var input = root.querySelector("#r-csv-input");
    if(input) input.click();
    return;
  }
  if(action === "parse-pasted-remediation"){
    var ta = root.querySelector("#r-paste-area");
    var parsed = parseRemediationText(ta ? ta.value : "");
    if(parsed.length === 0){
      state.importLog = "No rows parsed. Expected columns in this order: ISSUE, DESCRIPTION / REC, URL COUNT, AREA, DIFFICULTY, POTENTIAL IMPACT, SLIDE / TAB / LINKS. Every row needs a value in ISSUE. If blank cells are shifting your columns, use the CSV upload instead.";
      state.importLogWarn = true;
      render();
      return;
    }
    state.remediation = state.remediation.concat(parsed);
    var pasteMsg = "Imported " + parsed.length + " row" + (parsed.length === 1 ? "" : "s") + " from the paste box.";
    var pasteGaps = summarizeMissingFields(parsed);
    if(pasteGaps) pasteMsg += " " + pasteGaps;
    state.importLog = pasteMsg;
    state.importLogWarn = !!pasteGaps;
    render();
    return;
  }
  if(action === "clear-remediation"){
    if(confirm("Remove all " + state.remediation.length + " imported rows?")){
      state.remediation = [];
      state.importLog = "";
      state.importLogWarn = false;
      render();
    }
    return;
  }
  if(action === "remove-remediation-item"){
    state.remediation.splice(parseInt(el.getAttribute("data-idx"),10), 1);
    render(); return;
  }

  if(action === "generate-draft"){
    var bucket = buildBucketRows();
    var core = buildRulesBasedRoadmap();
    if(state.roadmap.core.length > 0 || state.roadmap.bucket.length > 0){
      if(!confirm("This replaces the current roadmap tasks with a fresh draft built from the remediation list. Continue?")) return;
    }
    closeBudgetGap(core, bucket);
    levelMonthlyLoad(core, bucket);
    state.roadmap.core = core;
    state.roadmap.bucket = bucket;
    state.aiLog = "";
    render();
    return;
  }
  if(action === "balance-budget"){
    closeBudgetGap(state.roadmap.core, state.roadmap.bucket);
    levelMonthlyLoad(state.roadmap.core, state.roadmap.bucket);
    render();
    return;
  }
  if(action === "run-ai-polish"){ runAiPolishPass(); return; }

  if(action === "open-picker"){ state.modal = {open:true, target: el.getAttribute("data-target"), search:""}; render(); return; }
  if(action === "close-modal" || action === "close-modal-overlay"){
    if(action === "close-modal-overlay" && e.target !== el) return;
    state.modal.open = false; render(); return;
  }
  if(action === "pick-menu-item"){
    var menuId = el.getAttribute("data-menuid");
    var isMigration = el.getAttribute("data-migration") === "1";
    var duration = state.setup.duration;
    var newTask;
    if(isMigration){
      var mt = findMigrationTask(menuId);
      newTask = {id:uid("task"), name:mt.name, description:mt.description, hoursBase:mt.hours, multiplier:1, months:newMonthsArray(duration,"none"), sourceMenuId:menuId, linkedRemediationIds:[]};
    } else {
      var dt = findMenuTask(menuId);
      newTask = {id:uid("task"), name:dt.name, description:dt.description, hoursBase: menuTaskHours(dt) || 1, multiplier:1, months:newMonthsArray(duration,"none"), sourceMenuId:menuId, linkedRemediationIds:[]};
    }
    state.roadmap[state.modal.target].push(newTask);
    state.modal.open = false;
    render();
    return;
  }

  if(action === "move-task"){
    var target = el.getAttribute("data-target");
    var idx = parseInt(el.getAttribute("data-idx"),10);
    var dir = parseInt(el.getAttribute("data-dir"),10);
    var arr = state.roadmap[target];
    var swapIdx = idx + dir;
    if(swapIdx < 0 || swapIdx >= arr.length) return;
    var tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
    render(); return;
  }
  if(action === "remove-task"){
    var target2 = el.getAttribute("data-target");
    state.roadmap[target2].splice(parseInt(el.getAttribute("data-idx"),10), 1);
    render(); return;
  }
  if(action === "toggle-month"){
    var target3 = el.getAttribute("data-target");
    var idx3 = parseInt(el.getAttribute("data-idx"),10);
    var mi = parseInt(el.getAttribute("data-month"),10);
    var t3 = state.roadmap[target3][idx3];
    t3.months[mi] = !t3.months[mi];
    render(); return;
  }

  if(action === "group-by-month"){ groupTasksByMonth(); render(); return; }
  if(action === "export-roadmap"){ exportRoadmapFile(); return; }
  if(action === "trigger-roadmap-import"){
    var rmInput = root.querySelector("#r-roadmap-import");
    if(rmInput) rmInput.click();
    return;
  }
  if(action === "clear-project"){
    if(!confirm("Clear this project? Client details, the remediation list, and the roadmap will be reset. Your SEO Menu edits are kept.")) return;
    clearProject();
    return;
  }
  if(action === "save-draft"){ saveDraftToStorage(); return; }
  if(action === "download-csv"){ downloadCsv(); return; }
  if(action === "download-xlsx"){ downloadXlsx(); return; }
  if(action === "push-drive"){
    var folderInput = root.querySelector("#r-drive-folder");
    state.driveFolderId = folderInput ? folderInput.value.trim() : "";
    pushRoadmapToDrive(state.driveFolderId);
    return;
  }
}

/* ============================== INIT ============================== */
async function init(){
  render();
  await loadMenuFromStorage();
  var hadDraft = await loadDraftFromStorage();
  // Older drafts stored only a month count; map it back onto a duration option id.
  var opts = durationOptions();
  var valid = opts.some(function(o){ return o.id === state.setup.durationId; });
  if(!valid){
    var byColumns = null;
    for(var i=0;i<opts.length;i++){ if(opts[i].columns === state.setup.duration && opts[i].factor === 1){ byColumns = opts[i]; break; } }
    applyDurationOption(byColumns ? byColumns.id : DURATION_SET_DEFAULT_ID[durationSetKey(state.setup.roadmapType)]);
  }
  recalcMonthlyBudget();
  if(hadDraft) state.saveStatus = "Loaded saved progress";
  render();
}
init();

})();
</script>
